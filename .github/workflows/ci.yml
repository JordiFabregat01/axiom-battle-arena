name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run server:build
      - name: End-to-end (headless Chrome + game server)
        run: |
          npx vite preview --port 4173 &
          sleep 3
          npm run e2e

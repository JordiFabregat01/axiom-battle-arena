# Static web app on Netlify. Set VITE_ARENA_WS_URL (wss://…), VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# and (later) VITE_CHECKOUT_URL as environment variables in the Netlify site settings.
[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cards/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
